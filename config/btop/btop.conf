# Omarchy-style btop, adapted from Omarchy 3.8.4 (MIT). Read-only defaults:
# copy to ~/.config/btop/btop.conf to change and keep settings.
color_theme = "tokyo-night"
theme_background = true
truecolor = true
vim_keys = true
rounded_corners = true
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = false
show_uptime = true
save_config_on_exit = false
