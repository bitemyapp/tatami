# Omarchy-style idle handling after Omarchy 4's idle service (MIT): lock
# after five minutes (config/omarchy/shell.json idle.lock = 300); the lock
# turns the displays off a few seconds later. Stay Awake stops this unit.
general {
    lock_cmd = omarchy lock
    before_sleep_cmd = omarchy lock --lock-only
    after_sleep_cmd = omarchy wake 1
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = omarchy lock
    on-resume = omarchy wake
}
