# Omarchy-style idle handling, adapted from Omarchy 3.8.4 (MIT): lock after
# five minutes; the lock turns the displays off a few seconds later.
general {
    lock_cmd = omarchy lock
    before_sleep_cmd = omarchy lock --lock-only
    after_sleep_cmd = omarchy wake 1
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = omarchy lock
    on-resume = omarchy wake
}
